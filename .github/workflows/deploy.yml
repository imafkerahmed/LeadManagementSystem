name: Deploy Lead Management

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push the Next.js App
      - name: Build and Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lead-management-app:latest
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ secrets.NEXT_PUBLIC_POCKETBASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: [self-hosted, Linux, X64, lead-management]
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sync Configuration and Restart
        run: |
          # Copy the latest docker-compose.yml to your data folder
          install -D -m 0644 docker-compose.yml '/home/codix/LeadManagementSystem/deployment/docker-compose.yml'

          cd '/home/codix/LeadManagementSystem/deployment'

          # Guardrail: deployment expects an env file on the server.
          if [ ! -f .env ]; then
            echo "Missing '/home/codix/LeadManagementSystem/deployment/.env' on server"
            exit 1
          fi

          docker compose pull
          docker compose down --remove-orphans
          docker compose up -d --no-build
          docker image prune -f
