name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lead-management-app:latest
            ${{ secrets.DOCKER_USERNAME }}/lead-management-app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ secrets.NEXT_PUBLIC_POCKETBASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/lead-management-app:latest

      - name: Restart application container
        run: |
          ENV_FILE="/DATA/Web Projects/lead-management/.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing $ENV_FILE"
            exit 1
          fi

          set -a
          source "$ENV_FILE"
          set +a

          docker stop lead-management-app || true
          docker rm lead-management-app || true

          docker run -d \
            --name lead-management-app \
            --restart unless-stopped \
            -p "${APP_PORT:-8082}:3000" \
            --env-file "$ENV_FILE" \
            ${{ secrets.DOCKER_USERNAME }}/lead-management-app:latest

      - name: Cleanup old images
        run: docker image prune -f
